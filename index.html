<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sudoku Template</title>
<style>
  :root {
    --thin: 1px;
    --thick: 3px;
    --line: #000;
    --thin-line: #777;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px 16px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #000;
    background: #f3f3f3;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }

  .toolbar button {
    font: inherit;
    padding: 8px 16px;
    border: 1px solid #555;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
  }

  .toolbar button:hover { background: #e8e8e8; }

  .hint {
    margin: 0;
    font-size: 0.85rem;
    color: #555;
    text-align: center;
  }

  .sheet {
    --size: min(92vw, 540px);
    width: var(--size);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .title {
    width: 100%;
    font: inherit;
    font-size: 1.4rem;
    font-weight: 600;
    text-align: center;
    border: none;
    border-bottom: 1px dashed #aaa;
    background: transparent;
    padding: 4px;
  }

  .grid {
    width: var(--size);
    height: var(--size);
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(9, 1fr);
    border: var(--thick) solid var(--line);
    background: #fff;
  }

  .cell {
    width: 100%;
    height: 100%;
    min-width: 0;
    margin: 0;
    padding: 0;
    border: 0 solid var(--thin-line);
    border-right-width: var(--thin);
    border-bottom-width: var(--thin);
    border-radius: 0;
    background: transparent;
    color: #000;
    font: inherit;
    font-size: calc(var(--size) / 9 * 0.6);
    line-height: 1;
    text-align: center;
    caret-color: transparent;
  }

  /* Last column / last row: the grid's outer border does the job */
  .cell:nth-child(9n) { border-right-width: 0; }
  .cell:nth-child(n+73) { border-bottom-width: 0; }

  /* Thick lines between the 3x3 boxes */
  .cell:nth-child(9n+3),
  .cell:nth-child(9n+6) {
    border-right: var(--thick) solid var(--line);
  }
  .cell:nth-child(n+19):nth-child(-n+27),
  .cell:nth-child(n+46):nth-child(-n+54) {
    border-bottom: var(--thick) solid var(--line);
  }

  .cell:focus {
    outline: none;
    background: #cfe5ff;
  }

  @page {
    size: A4 portrait;
    margin: 15mm;
  }

  @media print {
    body {
      padding: 0;
      background: #fff;
      display: block;
    }

    .toolbar, .hint { display: none; }

    /* 144mm grid = 16mm cells, at the top of the page, centred horizontally */
    .sheet {
      --size: 144mm;
      --thin: 0.3mm;
      --thick: 0.9mm;
      --thin-line: #000;
      margin: 0 auto;
      gap: 6mm;
    }

    .title {
      border: none;
      font-size: 18pt;
    }
    .title:placeholder-shown { display: none; }

    .grid { break-inside: avoid; }

    .cell:focus { background: transparent; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <button type="button" id="print">Print</button>
  <button type="button" id="clear">Clear</button>
</div>
<p class="hint">Type 1&ndash;9 to fill a square, Space to skip one, arrow keys to move, Backspace to undo, Delete or 0 to clear. Leave it blank to print an empty grid.</p>

<div class="sheet">
  <input class="title" id="title" type="text" placeholder="Title (optional)" aria-label="Title" autocomplete="off">
  <div class="grid" id="grid" role="grid" aria-label="Sudoku grid"></div>
</div>

<script>
(function () {
  var STORAGE_KEY = 'sudoku-template';
  var grid = document.getElementById('grid');
  var title = document.getElementById('title');
  var cells = [];
  var typedFrom = null;   // index of the square just typed into, until the next key or click
  var typedRun = 0;       // how many squares in a row were typed, ending at typedFrom

  for (var i = 0; i < 81; i++) {
    var input = document.createElement('input');
    input.className = 'cell';
    input.type = 'text';
    input.inputMode = 'numeric';
    input.maxLength = 1;
    input.autocomplete = 'off';
    input.setAttribute('aria-label', 'Row ' + (Math.floor(i / 9) + 1) + ', column ' + (i % 9 + 1));
    input.dataset.index = i;
    grid.appendChild(input);
    cells.push(input);
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        title: title.value,
        cells: cells.map(function (c) { return c.value; })
      }));
    } catch (e) { /* storage unavailable: carry on without saving */ }
  }

  function load() {
    try {
      var data = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (!data) return;
      title.value = data.title || '';
      (data.cells || []).forEach(function (v, i) {
        if (cells[i] && /^[1-9]$/.test(v)) cells[i].value = v;
      });
    } catch (e) { /* nothing saved or unreadable */ }
  }

  function focusCell(index) {
    if (index >= 0 && index < 81) cells[index].focus();
  }

  grid.addEventListener('keydown', function (e) {
    var cell = e.target;
    if (!cell.classList.contains('cell')) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var i = Number(cell.dataset.index);
    var from = typedFrom, run = typedRun;
    typedFrom = null;
    typedRun = 0;
    // True when the cursor is still where the last entry left it
    var justTyped = from !== null && i === Math.min(from + 1, 80);

    function entered() {        // record an entry at this square and advance
      typedRun = (justTyped ? run : 0) + 1;
      typedFrom = i;
      focusCell(i + 1);         // wraps to the next row; stays put on the last square
    }

    switch (e.key) {
      // Up/down wrap within the column; left/right wrap in reading order
      case 'ArrowUp':    focusCell((i + 72) % 81); break;
      case 'ArrowDown':  focusCell((i + 9) % 81); break;
      case 'ArrowLeft':  focusCell((i + 80) % 81); break;
      case 'ArrowRight': focusCell((i + 1) % 81); break;
      // Straight after typing a number the cursor has already advanced, so
      // go below the square that was filled in; otherwise just move down
      case 'Enter':
        focusCell(((justTyped ? from : i) + 9) % 81);
        break;
      case 'Backspace':
        if (justTyped) {
          // Undo the entry just made, and keep undoing back along a run of entries
          cells[from].value = '';
          save();
          focusCell(from);
          if (run > 1) { typedFrom = from - 1; typedRun = run - 1; }
        } else if (cell.value) {
          cell.value = '';      // populated: clear it and stay put
          save();
        } else if (i > 0) {
          focusCell(i - 1);
        }
        break;
      case 'Delete':
      case '0':
        cell.value = '';
        save();
        break;
      case ' ':                 // "types" a blank: empty the square and advance
        cell.value = '';
        save();
        entered();
        break;
      default:
        if (/^[1-9]$/.test(e.key)) {
          cell.value = e.key;   // overwrite whatever was there
          save();
          entered();
        } else if (e.key.length !== 1) {
          return;               // Tab, Enter etc. keep default behaviour
        }
    }
    e.preventDefault();
  });

  // Covers paste and on-screen keyboards that don't send useful keydown events
  grid.addEventListener('input', function (e) {
    var cell = e.target;
    if (!cell.classList.contains('cell')) return;
    var match = cell.value.match(/[1-9]/);
    cell.value = match ? match[0] : '';
    save();
    if (match) {
      typedFrom = Number(cell.dataset.index);
      typedRun = 1;
      focusCell(typedFrom + 1);
    }
  });

  grid.addEventListener('pointerdown', function () { typedFrom = null; typedRun = 0; });

  title.addEventListener('input', save);

  document.getElementById('print').addEventListener('click', function () {
    window.print();
  });

  document.getElementById('clear').addEventListener('click', function () {
    if (!confirm('Clear the title and all numbers?')) return;
    title.value = '';
    cells.forEach(function (c) { c.value = ''; });
    save();
    focusCell(0);
  });

  load();
})();
</script>
</body>
</html>
